# Balanceador de carga delante de las réplicas de catalogo-svc   [IE5]
# El DNS interno de Docker (127.0.0.11) devuelve la IP de cada réplica de
# "catalogo-svc". Al usar una variable en proxy_pass, nginx vuelve a resolver
# cada 10 s y reparte las peticiones entre todas las réplicas (round-robin),
# incluidas las que se agreguen al escalar.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    set $catalogo http://catalogo-svc:8080;

    # Healthcheck del propio balanceador
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $catalogo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Si una réplica falla, se reintenta en otra
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}
