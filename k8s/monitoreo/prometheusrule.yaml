# Alertas del microservicio Catalogo   [EP3 IE1, IE4, IE6]
# Cada alerta tiene una accion asociada (ver docs/06_Observabilidad.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: catalogo-svc-alertas
  namespace: catalogo
  labels:
    app: catalogo-svc
spec:
  groups:
    - name: catalogo-disponibilidad
      rules:
        - alert: CatalogoCaido
          expr: sum(up{namespace="catalogo", job="catalogo-svc"}) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Ninguna replica de catalogo-svc responde"
            accion: "Revisar pods y logs; si coincide con un deploy, hacer rollback"
        - alert: CatalogoReplicaCaida
          expr: sum(up{namespace="catalogo", job="catalogo-svc"}) < 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Hay menos de 2 replicas sanas"
            accion: "Verificar que Kubernetes recree el pod; revisar eventos del deployment"
    - name: catalogo-errores
      rules:
        - alert: CatalogoErrores5xxAltos
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="catalogo", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_requests_seconds_count{namespace="catalogo"}[5m])), 1e-9) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Mas del 5% de las peticiones terminan en error 5xx"
            accion: "Detener promociones a produccion y revisar el ultimo cambio desplegado"
        - alert: CatalogoErroresEnLogs
          expr: sum(increase(logback_events_total{namespace="catalogo", level="error"}[5m])) > 10
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Mas de 10 lineas ERROR en los logs en 5 minutos"
            accion: "Revisar los logs (kubectl logs) para identificar la causa"
    - name: catalogo-recursos
      rules:
        - alert: CatalogoLatenciaAlta
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace="catalogo"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "La latencia p95 supera 1 segundo"
            accion: "Evaluar escalar replicas (HPA) o revisar consultas lentas"
        - alert: CatalogoMemoriaAlta
          expr: |
            sum by (pod) (jvm_memory_used_bytes{namespace="catalogo", area="heap"})
              / sum by (pod) (jvm_memory_max_bytes{namespace="catalogo", area="heap"}) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "El heap de la JVM supera el 85%"
            accion: "Revisar fugas de memoria o subir el limite de memoria del pod"
        - alert: CatalogoCpuAlta
          expr: avg(process_cpu_usage{namespace="catalogo"}) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "El uso de CPU promedio supera el 80%"
            accion: "Confirmar que el HPA escale; si no alcanza, subir maxReplicas"
